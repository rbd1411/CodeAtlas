[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeatlas"
version = "0.1.0"
description = "Local-first, evidence-grounded RAG for software repositories"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.66,<3",
  "pathspec>=0.12,<1",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
]

[tool.setuptools.packages.find]
include = ["codeatlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
